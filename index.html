<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7286 WORK</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--brown:#5C3A1E;--brown-dk:#3D2510;--brown-md:#7A4E2D;--gold:#FFD700;}
html,body{min-height:100%;background:var(--brown);font-family:'Nunito',sans-serif;color:#fff;overscroll-behavior:none;}
body{padding-bottom:220px;}

/* ── HEADER ── */
.hdr{
  background:var(--brown-dk);padding:14px 16px 10px;
  text-align:center;position:sticky;top:0;z-index:200;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.hdr h1{font-family:'Fredoka One',cursive;font-size:26px;color:var(--gold);letter-spacing:1px;}
.admin-link{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:11px;opacity:.4;color:#fff;text-decoration:none;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;
}
.admin-link:hover{opacity:.8;}

/* ── PERSON STRIP ── */
.strip{
  background:var(--brown-dk);padding:10px 12px 14px;
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  position:sticky;top:58px;z-index:190;
  border-bottom:3px solid var(--brown-md);
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.pa{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
}
.pa-img{
  width:54px;height:54px;border-radius:50%;
  border:3px solid rgba(255,255,255,.8);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:22px;color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
  overflow:hidden;transition:transform .15s;
}
.pa:active .pa-img{transform:scale(.92);}
.pa-img img{width:100%;height:100%;object-fit:cover;}
.pa-name{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;}

/* ── SORT BAR ── */
.sort-bar{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;align-items:center;}
.sort-bar::-webkit-scrollbar{display:none;}
.sort-lbl{font-size:11px;font-weight:800;opacity:.6;white-space:nowrap;text-transform:uppercase;}
.srt{
  padding:5px 13px;border-radius:18px;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);
  color:#fff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;
  cursor:pointer;white-space:nowrap;transition:all .18s;
}
.srt.on{background:var(--gold);color:var(--brown-dk);border-color:var(--gold);}

/* ── CHORE GRID ── */
.grid{padding:8px 14px 20px;display:flex;flex-direction:column;gap:12px;}

/* ── CHORE CARD ── */
.card{
  border-radius:18px;padding:15px;position:relative;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  transition:transform .15s,box-shadow .15s,outline .1s;
  outline:3px solid transparent;
}
.card.over{
  transform:scale(1.025);
  box-shadow:0 10px 36px rgba(255,255,255,.35);
  outline:3px dashed rgba(255,255,255,.9);
}
.card-hdr{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px;}
.c-icon{font-size:40px;flex-shrink:0;line-height:1;}
.c-icon img{width:48px;height:48px;border-radius:10px;object-fit:cover;}
.c-info{flex:1;min-width:0;}
.c-name{font-family:'Fredoka One',cursive;font-size:20px;line-height:1.2;margin-bottom:3px;}
.c-desc{font-size:13px;opacity:.85;line-height:1.4;}
.c-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:6px;}
.c-tok{background:rgba(0,0,0,.28);border-radius:16px;padding:4px 11px;font-size:14px;font-weight:800;}
.c-exp{font-size:12px;font-weight:700;}

/* expiry */
.exp-ok{opacity:.75;}
.exp-soon{color:#FFE066;}
.exp-last{font-size:14px;animation:flame .55s ease-in-out infinite alternate;}
@keyframes flame{
  from{color:#FF4500;text-shadow:0 0 6px #FF4500,0 0 14px #FF6B00,0 0 22px #FFD700;}
  to  {color:#FFD700;text-shadow:0 0 10px #FF6B00,0 0 22px #FFD700,0 0 34px #FF4500;}
}
.exp-ext{color:#FF8080;font-size:13px;}

/* assignments */
.asgns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.achip{
  display:flex;align-items:center;gap:5px;
  padding:4px 8px 4px 4px;
  background:rgba(0,0,0,.28);border-radius:16px;
  font-size:12px;font-weight:700;
}
.achip-av{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;overflow:hidden;
}
.achip-av img{width:100%;height:100%;object-fit:cover;}
.achip-st{font-size:10px;opacity:.65;margin-left:1px;}
.achip-rm{background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:16px;padding:0 0 0 3px;line-height:1;}
.drop-hint{
  border:2px dashed rgba(255,255,255,.35);border-radius:12px;
  padding:7px 10px;text-align:center;font-size:12px;font-weight:700;
  opacity:.65;margin-top:9px;
}
.drop-hint.full{opacity:.35;border-style:solid;}

/* ── FOOTER SCOREBOARD ── */
.footer{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--brown-dk);
  border-top:3px solid var(--gold);
  padding:8px 14px 10px;
  z-index:200;
}
.f-title{
  font-family:'Fredoka One',cursive;font-size:13px;
  color:var(--gold);text-align:center;
  text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;
}
.scores{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:5px;}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:44px;}
.sc-av{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;
  border:2px solid rgba(255,255,255,.5);overflow:hidden;
  transition:transform .15s;
}
.sc:active .sc-av{transform:scale(.9);}
.sc-av img{width:100%;height:100%;object-fit:cover;}
.sc-name{font-size:10px;font-weight:800;opacity:.75;}
.sc-tok{font-size:13px;font-weight:900;color:var(--gold);}
.sc-pend{font-size:10px;color:#FFB800;opacity:.8;}
.conv{text-align:center;font-size:11px;opacity:.55;margin-top:2px;}

/* recent payouts strip */
.recent-pays{
  margin-top:4px;
  display:flex;flex-direction:column;gap:1px;
}
.rpay{
  text-align:center;font-size:10px;opacity:.4;
  font-weight:600;letter-spacing:.2px;
}

/* ── MODAL ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.75);z-index:500;
  justify-content:center;align-items:flex-end;
}
.overlay.on{display:flex;}
.modal{
  background:var(--brown-md);border-radius:24px 24px 0 0;
  padding:24px 20px 32px;width:100%;max-width:480px;
  max-height:80vh;overflow-y:auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.5);
}
.modal h2{font-family:'Fredoka One',cursive;font-size:22px;color:var(--gold);margin-bottom:14px;}
.modal-close{float:right;background:none;border:none;font-size:26px;color:#fff;cursor:pointer;margin:-4px -4px 0 0;}
.earn-stat{margin-bottom:14px;}
.earn-big{font-size:32px;font-weight:900;color:var(--gold);}
.earn-pend{font-size:13px;opacity:.7;margin-top:2px;}
.earn-dol{font-size:16px;font-weight:700;opacity:.85;margin-top:2px;}
.earn-list{display:flex;flex-direction:column;gap:8px;}
.ei{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 13px;}
.ei-name{font-weight:800;font-size:14px;margin-bottom:2px;}
.ei-meta{font-size:11px;opacity:.65;}

/* ── DRAG CLONE ── */
.dclone{
  position:fixed;pointer-events:none;z-index:9999;
  border-radius:50%;width:56px;height:56px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:22px;color:#fff;
  border:3px solid rgba(255,255,255,.9);
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  transform:scale(1.15) translate(-50%,-50%);
  overflow:hidden;
}

/* ── TOAST ── */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  background:rgba(20,10,5,.9);color:#fff;
  padding:9px 20px;border-radius:20px;
  font-size:14px;font-weight:700;z-index:1000;
  pointer-events:none;transition:opacity .3s;
  white-space:nowrap;max-width:90vw;text-align:center;
}
.empty{text-align:center;opacity:.45;padding:60px 20px;font-size:16px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <h1 id="pg-title">7286 WORK</h1>
  <a class="admin-link" href="admin.html">⚙ Admin</a>
</div>

<!-- PERSON STRIP -->
<div class="strip" id="strip">
  <div style="opacity:.4;font-size:13px;">Loading...</div>
</div>

<!-- SORT BAR -->
<div class="sort-bar">
  <span class="sort-lbl">Sort:</span>
  <button class="srt on" data-sort="expiry"  onclick="setSort(this)">⏰ Expiry</button>
  <button class="srt"    data-sort="tokens"  onclick="setSort(this)">💰 Tokens</button>
  <button class="srt"    data-sort="name"    onclick="setSort(this)">🔤 Name</button>
</div>

<!-- CHORE GRID -->
<div class="grid" id="grid">
  <div class="empty">Loading chores...</div>
</div>

<!-- FOOTER -->
<div class="footer">
  <div class="f-title">🏆 Scoreboard</div>
  <div class="scores" id="scores"></div>
  <div class="conv" id="conv">4 Tokens = $1.00</div>
  <div class="recent-pays" id="recent-pays"></div>
</div>

<!-- EARNINGS MODAL -->
<div class="overlay" id="earn-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('earn-modal')">✕</button>
    <h2 id="earn-title">Earnings</h2>
    <div class="earn-stat">
      <div class="earn-big"><span id="earn-conf">0</span> <span id="earn-tok-lbl">Tokens</span></div>
      <div class="earn-dol" id="earn-dol"></div>
      <div class="earn-pend" id="earn-pend"></div>
    </div>
    <div class="earn-list" id="earn-list"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" style="opacity:0"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let cfg       = { tokenName:'Token', conversionRate:4 };
let users     = {};
let chores    = {};
let completed = {};
let payouts   = {};
let sort      = 'expiry';
let dragUID   = null;
let dragClone = null;

const CARD_COLORS = [
  '#C1121F','#E76F51','#2A9D8F','#264653','#7B2D8B',
  '#F4A261','#457B9D','#D62828','#023E8A','#6A0572',
  '#E63946','#2DC653','#F77F00','#0077B6','#9D4EDD'
];

// ─────────────────────────────────────────────
// FIREBASE LISTENERS
// ─────────────────────────────────────────────
db.ref('config').on('value',    s=>{ cfg      =s.val()||cfg;       updateLabels(); renderScores(); });
db.ref('users').on('value',     s=>{ users    =s.val()||{};        renderStrip(); renderScores(); renderChores(); });
db.ref('chores').on('value',    s=>{ chores   =s.val()||{};        renderChores(); renderScores(); });
db.ref('completed').on('value', s=>{ completed=s.val()||{}; });
db.ref('payouts').on('value',   s=>{ payouts  =s.val()||{};        renderRecentPayouts(); });

// ─────────────────────────────────────────────
// LABELS
// ─────────────────────────────────────────────
function updateLabels(){
  const n = cfg.tokenName||'Token';
  const r = cfg.conversionRate||4;
  document.getElementById('conv').textContent = `${r} ${n}s = $1.00`;
}

// ─────────────────────────────────────────────
// EXPIRY
// ─────────────────────────────────────────────
function daysLeft(c){
  const exp=(c.createdAt||Date.now())+((c.daysAvailable||1)*86400000);
  return Math.floor((exp-Date.now())/86400000);
}
function expiryHTML(dl){
  if(dl>=3) return `<span class="c-exp exp-ok">📅 ${dl} days left</span>`;
  if(dl===2) return `<span class="c-exp exp-soon">⚠️ 2 days left</span>`;
  if(dl===1) return `<span class="c-exp exp-soon">⚠️ 1 day left!</span>`;
  if(dl===0) return `<span class="c-exp exp-last">🔥 LAST DAY! 🔥</span>`;
  if(dl===-1)return `<span class="c-exp exp-ext">💩😭 for real guys, last day</span>`;
  return '';
}

// ─────────────────────────────────────────────
// PENDING TOKEN CALC (live)
// ─────────────────────────────────────────────
function pendingFor(uid){
  let total=0;
  Object.values(chores).forEach(c=>{
    if(c.status==='accepted') return;
    const a=c.assignments||{};
    if(a[uid]&&a[uid].status==='pending'){
      const n=Object.keys(a).length;
      total+=Math.ceil((c.tokenValue||1)/n);
    }
  });
  return total;
}

// ─────────────────────────────────────────────
// RENDER: PERSON STRIP
// ─────────────────────────────────────────────
function renderStrip(){
  const el=document.getElementById('strip');
  el.innerHTML='';
  Object.entries(users).forEach(([uid,u])=>{
    const div=document.createElement('div');
    div.className='pa'; div.dataset.uid=uid;
    div.innerHTML=`
      <div class="pa-img" style="background:${u.color||'#888'}">
        ${u.imageUrl?`<img src="${u.imageUrl}" alt="${u.name}" onerror="this.style.display='none'">`:`${u.name[0]}`}
      </div>
      <span class="pa-name" style="color:${u.color||'#fff'}">${u.name}</span>`;
    attachDragSource(div,uid);
    el.appendChild(div);
  });
}

// ─────────────────────────────────────────────
// RENDER: CHORE GRID
// ─────────────────────────────────────────────
function renderChores(){
  const grid=document.getElementById('grid');
  const tok=cfg.tokenName||'Token';

  let list=Object.entries(chores).filter(([,c])=>{
    const dl=daysLeft(c);
    return dl>=-1 && c.status!=='accepted';
  });

  if(sort==='expiry')  list.sort((a,b)=>daysLeft(a[1])-daysLeft(b[1]));
  else if(sort==='tokens') list.sort((a,b)=>(b[1].tokenValue||0)-(a[1].tokenValue||0));
  else list.sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));

  if(!list.length){
    grid.innerHTML='<div class="empty">🎉 No chores right now!<br>Go touch some grass.</div>';
    return;
  }

  grid.innerHTML='';
  list.forEach(([cid,c],i)=>{
    const dl=daysLeft(c);
    const a=c.assignments||{};
    const ac=Object.keys(a).length;
    const max=c.maxAssignees||1;
    const full=ac>=max;
    const previewPer=Math.ceil((c.tokenValue||1)/(ac+1));
    const col=CARD_COLORS[i%CARD_COLORS.length];

    let achips='';
    if(ac>0){
      achips='<div class="asgns">';
      Object.entries(a).forEach(([uid,info])=>{
        const u=users[uid]; if(!u) return;
        const st=info.status==='confirmed'?'✅':'⏳';
        achips+=`<div class="achip">
          <div class="achip-av" style="background:${u.color||'#888'}">${u.imageUrl?`<img src="${u.imageUrl}">`:`${u.name[0]}`}</div>
          <span>${u.name}</span>
          <span class="achip-st">${st}</span>
          <button class="achip-rm" onclick="removeAsgn('${cid}','${uid}',event)">×</button>
        </div>`;
      });
      achips+='</div>';
    }

    const hint=full
      ?`<div class="drop-hint full">🔒 Full (${ac}/${max})</div>`
      :`<div class="drop-hint">👆 Drag your face here · ${max-ac} spot${max-ac>1?'s':''} · ${previewPer} ${tok}s each</div>`;

    const card=document.createElement('div');
    card.className='card'; card.dataset.cid=cid; card.style.background=col;
    card.innerHTML=`
      <div class="card-hdr">
        <div class="c-icon">${c.imageUrl?`<img src="${c.imageUrl}" alt="">`:c.icon||'✨'}</div>
        <div class="c-info">
          <div class="c-name">${c.name}</div>
          <div class="c-desc">${c.description||''}</div>
        </div>
      </div>
      <div class="c-meta">
        <div class="c-tok">💰 ${c.tokenValue} ${tok}${c.tokenValue!==1?'s':''}</div>
        ${expiryHTML(dl)}
      </div>
      ${achips}${hint}`;
    attachDropTarget(card,cid);
    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────────
// RENDER: SCOREBOARD
// ─────────────────────────────────────────────
function renderScores(){
  const row=document.getElementById('scores');
  row.innerHTML='';
  Object.entries(users).forEach(([uid,u])=>{
    const conf=u.confirmedTokens||0;
    const pend=pendingFor(uid);
    const chip=document.createElement('div');
    chip.className='sc'; chip.onclick=()=>openEarnings(uid);
    chip.innerHTML=`
      <div class="sc-av" style="background:${u.color||'#888'}">
        ${u.imageUrl?`<img src="${u.imageUrl}" alt="">`:`${u.name[0]}`}
      </div>
      <div class="sc-name">${u.name}</div>
      <div class="sc-tok">⭐ ${conf}</div>
      ${pend>0?`<div class="sc-pend">+${pend}⏳</div>`:''}`;
    row.appendChild(chip);
  });
}

// ─────────────────────────────────────────────
// RENDER: RECENT PAYOUTS (last 3, footer)
// ─────────────────────────────────────────────
function renderRecentPayouts(){
  const el=document.getElementById('recent-pays');
  const tok=cfg.tokenName||'Token';
  const list=Object.values(payouts)
    .sort((a,b)=>(b.timestamp||0)-(a.timestamp||0))
    .slice(0,3);
  if(!list.length){ el.innerHTML=''; return; }
  el.innerHTML=list.map(p=>{
    const d=new Date(p.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return `<div class="rpay">💵 ${p.userName||p.userId} · ${p.tokens} ${tok}s · $${p.dollars} · ${d}</div>`;
  }).join('');
}

// ─────────────────────────────────────────────
// DRAG & DROP — Mouse
// ─────────────────────────────────────────────
function attachDragSource(el,uid){
  el.draggable=true;
  el.addEventListener('dragstart',e=>{ dragUID=uid; e.dataTransfer.effectAllowed='copy'; });
  el.addEventListener('dragend',()=>{ dragUID=null; });
  attachTouchDrag(el,uid);
}
function attachDropTarget(card,cid){
  card.addEventListener('dragover',e=>{ e.preventDefault(); card.classList.add('over'); });
  card.addEventListener('dragleave',()=>card.classList.remove('over'));
  card.addEventListener('drop',e=>{ e.preventDefault(); card.classList.remove('over'); if(dragUID) handleDrop(cid,dragUID); });
}

// ─────────────────────────────────────────────
// DRAG & DROP — Touch
// ─────────────────────────────────────────────
function attachTouchDrag(el,uid){
  el.addEventListener('touchstart',e=>{
    e.preventDefault();
    dragUID=uid;
    const t=e.touches[0];
    const u=users[uid];
    dragClone=document.createElement('div');
    dragClone.className='dclone';
    dragClone.style.background=u?.color||'#888';
    if(u?.imageUrl){
      const img=document.createElement('img');
      img.src=u.imageUrl;
      img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';
      dragClone.appendChild(img);
    } else {
      dragClone.textContent=u?.name[0]||'?';
    }
    dragClone.style.left=t.clientX+'px';
    dragClone.style.top=t.clientY+'px';
    document.body.appendChild(dragClone);
  },{passive:false});

  el.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=e.touches[0];
    if(dragClone){ dragClone.style.left=t.clientX+'px'; dragClone.style.top=t.clientY+'px'; }
    document.querySelectorAll('.card.over').forEach(c=>c.classList.remove('over'));
    const under=document.elementFromPoint(t.clientX,t.clientY);
    const card=under?.closest?.('.card');
    if(card) card.classList.add('over');
  },{passive:false});

  el.addEventListener('touchend',e=>{
    e.preventDefault();
    if(dragClone){ dragClone.remove(); dragClone=null; }
    document.querySelectorAll('.card.over').forEach(c=>c.classList.remove('over'));
    const t=e.changedTouches[0];
    const under=document.elementFromPoint(t.clientX,t.clientY);
    const card=under?.closest?.('.card');
    if(card&&dragUID) handleDrop(card.dataset.cid,dragUID);
    dragUID=null;
  },{passive:false});
}

// ─────────────────────────────────────────────
// DROP HANDLER
// ─────────────────────────────────────────────
function handleDrop(cid,uid){
  const c=chores[cid]; if(!c) return;
  const a=c.assignments||{};
  const max=c.maxAssignees||1;
  if(a[uid]){ toast(`${users[uid]?.name} is already on this! 🙄`); playBuzz(); return; }
  if(Object.keys(a).length>=max){ toast('This chore is full! 🔒'); playBuzz(); return; }
  db.ref(`chores/${cid}/assignments/${uid}`).set({ assignedAt:Date.now(), status:'pending' });
  playChime();
  toast(`${users[uid]?.name} claimed it! 🎉`);
}

function removeAsgn(cid,uid,e){
  e.stopPropagation();
  if(!confirm(`Remove ${users[uid]?.name} from this chore?`)) return;
  db.ref(`chores/${cid}/assignments/${uid}`).remove();
  toast(`${users[uid]?.name} removed`);
}

// ─────────────────────────────────────────────
// SORT
// ─────────────────────────────────────────────
function setSort(btn){
  sort=btn.dataset.sort;
  document.querySelectorAll('.srt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderChores();
}

// ─────────────────────────────────────────────
// EARNINGS MODAL
// ─────────────────────────────────────────────
function openEarnings(uid){
  const u=users[uid]; if(!u) return;
  const tok=cfg.tokenName||'Token';
  const rate=cfg.conversionRate||4;
  const conf=u.confirmedTokens||0;
  const pend=pendingFor(uid);
  const dol=(conf/rate).toFixed(2);

  document.getElementById('earn-title').textContent=`${u.name}'s Earnings`;
  document.getElementById('earn-conf').textContent=conf;
  document.getElementById('earn-tok-lbl').textContent=`${tok}s`;
  document.getElementById('earn-dol').textContent=`= $${dol}`;
  document.getElementById('earn-pend').textContent=pend>0?`+${pend} pending (not yet approved)`:'';

  const list=document.getElementById('earn-list');
  const hist=Object.values(completed)
    .filter(c=>c.assignments&&c.assignments[uid])
    .sort((a,b)=>(b.acceptedAt||0)-(a.acceptedAt||0))
    .slice(0,15);

  if(!hist.length){
    list.innerHTML='<div style="opacity:.4;text-align:center;padding:20px;">No completed chores yet — get to work! 💪</div>';
  } else {
    list.innerHTML=hist.map(c=>{
      const n=c.assignments[uid]?.tokensAwarded||0;
      const d=new Date(c.acceptedAt).toLocaleDateString();
      return `<div class="ei"><div class="ei-name">${c.icon||'✨'} ${c.name}</div><div class="ei-meta">+${n} ${tok}s · ${d}</div></div>`;
    }).join('');
  }
  document.getElementById('earn-modal').classList.add('on');
}

function closeModal(id){ document.getElementById(id).classList.remove('on'); }
document.getElementById('earn-modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal('earn-modal'); });

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity='0',2600);
}

// ─────────────────────────────────────────────
// SOUNDS
// ─────────────────────────────────────────────
let actx;
function getACtx(){ if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)(); return actx; }
function playChime(){
  try{
    const a=getACtx();
    [523,659,784,1047].forEach((f,i)=>{
      const o=a.createOscillator(),g=a.createGain();
      o.connect(g);g.connect(a.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.22,a.currentTime+i*.1);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+i*.1+0.4);
      o.start(a.currentTime+i*.1);o.stop(a.currentTime+i*.1+0.4);
    });
  }catch(e){}
}
function playBuzz(){
  try{
    const a=getACtx();
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type='sawtooth';o.frequency.value=120;
    g.gain.setValueAtTime(0.15,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3);
    o.start();o.stop(a.currentTime+0.3);
  }catch(e){}
}
</script>
